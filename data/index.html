<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>短信转发器</title>
<!-- 抢先在首帧前按 localStorage / 系统偏好设置主题，避免浅色闪一下 -->
<script>
(function(){
  try{
    var m = localStorage.getItem('smsf-theme') || 'system';
    var dark = m === 'dark' ||
      (m === 'system' && window.matchMedia &&
       window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
})();
</script>
<link rel="stylesheet" href="/assets/app.css">
<!-- x-cloak：Alpine 初始化前隐藏带该属性的元素，避免未编译模板闪现 -->
<style>[x-cloak]{display:none!important}</style>
<script defer src="/assets/vendor/alpine.min.js"></script>
<script defer src="/assets/app.js"></script>
</head>
<body>
<div class="app">
  <!-- 左侧菜单（由 app.js 按 MENU 配置渲染） -->
  <aside class="sidebar" id="sidebar"></aside>
  <div class="mask" id="mask"></div>

  <!-- 右侧：顶栏 + 内容区（hash 路由懒加载 pages/*.html） -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="菜单">
        <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      </button>
      <div class="topbar-title" id="pageTitle">仪表盘</div>
      <div class="topbar-right">
        <!-- 主题切换：system(跟随系统) -> light -> dark 三态循环，状态存 localStorage -->
        <button class="top-btn" id="themeBtn" aria-label="主题切换" title="主题切换"></button>
        <!-- SSE 连接状态：绿=已连接 黄=连接/重连中 红=断开（降级轮询）。
             不使用 Alpine 绑定：Alpine.start() 以微任务先于 defer 的 app.js 执行，
             彼时 store 尚未注册、绑定会失效，故由 app.js renderConnDot() 驱动 -->
        <i class="conn" id="connDot"></i>
        <!-- 用户名：点击跳转系统设置（管理账号 / 密码修改） -->
        <button class="chip chip-link" id="userChip" type="button" title="系统设置"></button>
        <button class="btn ghost sm" id="logoutBtn">退出登录</button>
      </div>
    </header>
    <main class="view" id="view">
      <div class="loading">加载中…</div>
    </main>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"></div>
</body>
</html>
