<div x-data="pageRgb()" x-init="init()">
  <div class="page-head">
    <div>
      <h2>RGB 氛围灯</h2>
      <p class="page-desc">板载 WS2812（GPIO48）· 预设颜色 / 任意 RGB / 亮度</p>
    </div>
    <button class="btn ghost sm" @click="refresh()">刷新</button>
  </div>

  <!-- 当前状态 -->
  <div class="card">
    <h3>当前颜色</h3>
    <div class="row"><span class="k">颜色</span>
      <span class="v"><i class="swatch" :style="currentSwatchStyle()"></i><span x-text="st.color || '-'"></span></span></div>
    <div class="row"><span class="k">RGB 值</span>
      <span class="v" x-text="(st.rgb || []).join(', ')"></span></div>
    <div class="row"><span class="k">亮度</span><span class="v" x-text="(st.bright || 0) + '%'"></span></div>
    <div class="bar" style="margin-top:12px">
      <button class="btn" @click="next()">切换到下一个</button>
      <button class="btn ghost" @click="off()">关闭</button>
    </div>
  </div>

  <!-- 亮度 -->
  <div class="card">
    <h3>亮度</h3>
    <div class="row"><span class="k">当前亮度</span>
      <span class="v" x-text="(st.bright || 0) + '%'"></span></div>
    <div class="bar" style="margin-top:10px">
      <input type="range" min="0" max="100" step="1" style="flex:1"
             x-model.number="bright" @input="touched = true" @change="applyBright()">
      <span class="v" style="min-width:46px;text-align:right" x-text="bright + '%'"></span>
    </div>
    <div class="hint">亮度对当前颜色实时折算（输出 = RGB × 亮度%），0% 即熄灭；
      重启后恢复默认 100%。</div>
  </div>

  <!-- 预设 -->
  <div class="card">
    <h3>预设颜色</h3>
    <div class="palette">
      <template x-for="(p, i) in presets" :key="p.name">
        <div class="sw" :class="{ on: isOn(p) }" @click="applyPreset(i)">
          <i :style="swatchStyle(p)"></i>
          <span x-text="p.name"></span>
        </div>
      </template>
    </div>
  </div>

  <!-- 自定义 -->
  <div class="card">
    <h3>自定义颜色</h3>
    <div class="bar">
      <div class="field" style="width:90px"><label>R (0-255)</label>
        <input type="number" min="0" max="255" x-model.number="r"></div>
      <div class="field" style="width:90px"><label>G (0-255)</label>
        <input type="number" min="0" max="255" x-model.number="g"></div>
      <div class="field" style="width:90px"><label>B (0-255)</label>
        <input type="number" min="0" max="255" x-model.number="b"></div>
      <div class="field"><label>预览</label>
        <i class="swatch" style="width:34px;height:34px;margin:0" :style="previewStyle()"></i></div>
      <div class="field"><label>&nbsp;</label>
        <button class="btn" @click="applyRaw()">应用</button></div>
    </div>
    <div class="hint">自定义颜色不影响预设索引；「切换到下一个」始终按预设表循环。</div>
  </div>
</div>
