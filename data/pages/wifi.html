<div x-data="pageWifi()" x-init="init()">
  <div class="page-head">
    <div>
      <h2>WiFi 设置</h2>
      <p class="page-desc">扫描附近网络、保存凭据并调整启动连接顺序（最多 5 组）</p>
    </div>
    <button class="btn sm" @click="scan()" :disabled="scanning">扫描附近 WiFi</button>
  </div>

  <!-- 当前状态 -->
  <div class="card">
    <h3>当前状态</h3>
    <div class="row"><span class="k">工作模式</span>
      <span class="v"><span class="badge" :class="wifi.mode === 'sta' ? 'ok' : (wifi.mode === 'ap' ? 'warn' : 'info')" x-text="modeText()"></span></span></div>
    <div class="row"><span class="k">连接信息</span><span class="v" x-text="connText()"></span></div>
    <div class="row"><span class="k">已保存配置</span><span class="v" x-text="(wifi.count || saved.length) + ' 组'"></span></div>
    <div class="hint" x-show="wifi.ap">AP 配网模式下设备热点为 <b x-text="wifi.apSsid"></b>（192.168.4.1），保存可用网络后重启将自动切换。</div>
    <div class="hint warn" x-show="wifi.ap && wifi.apSta > 0">检测到 <b x-text="wifi.apSta"></b> 个客户端正连接本热点，已暂停自动重连（每 60s 重试一次），以免打断配置；客户端离开后将自动恢复。</div>
  </div>

  <!-- 扫描结果 -->
  <div class="card" x-show="nets.length || scanHint">
    <h3>扫描结果 <span class="sub" x-text="scanHint"></span></h3>
    <table class="table" x-show="nets.length">
      <thead><tr><th>SSID</th><th>信号</th><th>安全性</th><th></th></tr></thead>
      <tbody>
        <template x-for="n in nets" :key="n.ssid">
          <tr>
            <td x-text="n.ssid"></td>
            <td x-text="n.rssi + ' dBm'"></td>
            <td><span class="badge" :class="n.secure ? 'warn' : 'ok'" x-text="n.secure ? '加密' : '开放'"></span></td>
            <td style="text-align:right"><button class="btn ghost sm" @click="pick(n.ssid)">选择</button></td>
          </tr>
        </template>
      </tbody>
    </table>
    <div class="hint" x-show="!nets.length && scanHint" x-text="scanHint"></div>
  </div>

  <!-- 添加 / 修改 -->
  <div class="card">
    <h3>保存网络</h3>
    <div class="bar">
      <div class="field" style="flex:1;min-width:160px"><label>SSID</label>
        <input x-model="ssid" placeholder="点击上方扫描结果自动填入" autocomplete="off"></div>
      <div class="field" style="flex:1;min-width:140px"><label>密码（开放网络留空）</label>
        <input x-model="pass" type="password" autocomplete="new-password"></div>
      <div class="field"><label>&nbsp;</label>
        <button class="btn" @click="save()" :disabled="saving" x-text="saving ? '保存中…' : '保存并连接'"></button></div>
    </div>
    <!-- 错误时切换为红底错误条（与右上角 toast 双通道） -->
    <div :class="wifiIsErr ? 'form-err' : 'hint'" x-show="wifiHint">
      <span class="ico" x-show="wifiIsErr">⚠</span><span x-text="wifiHint"></span>
    </div>
    <div class="hint" x-show="!wifiHint">同 SSID 再次保存会覆盖密码；启动时按下方列表顺序依次尝试连接。</div>
  </div>

  <!-- 已保存列表 -->
  <div class="card">
    <h3>已保存的网络 <span class="sub" x-text="saved.length + ' / 5'"></span></h3>
    <table class="table" x-show="saved.length">
      <thead><tr><th style="width:36px">#</th><th>SSID</th><th>密码</th><th style="width:150px;text-align:right">操作</th></tr></thead>
      <tbody>
        <template x-for="n in saved" :key="n.i">
          <tr>
            <td x-text="n.i + 1"></td>
            <td x-text="n.ssid"></td>
            <td><span class="badge" :class="n.hasPass ? 'ok' : 'info'" x-text="n.hasPass ? '已保存' : '开放'"></span></td>
            <td style="text-align:right;white-space:nowrap">
              <button class="btn ghost sm" @click="move(n.i, n.i - 1)" :disabled="n.i === 0">上移</button>
              <button class="btn ghost sm" @click="move(n.i, n.i + 1)" :disabled="n.i === saved.length - 1">下移</button>
              <button class="btn ghost sm" @click="del(n.i, n.ssid)">删除</button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
    <div class="empty" x-show="!saved.length">
      <div class="icon">&#128246;</div>
      <h3>暂无保存的网络</h3>
      <p>扫描并保存后，设备重启将按列表顺序自动连接</p>
    </div>
  </div>
</div>
