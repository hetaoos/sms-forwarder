<div x-data="pageDashboard()" x-init="init()">
  <div class="page-head">
    <div>
      <h2>仪表盘</h2>
      <p class="page-desc">设备运行状态总览 · 每 2 秒自动刷新</p>
    </div>
    <button class="btn ghost sm" @click="restSnapshot()">刷新</button>
  </div>

  <!-- 关键指标 -->
  <div class="stats">
    <div class="stat"><div class="k">运行时间</div><div class="v" x-text="fmt(st.uptime || 0)"></div></div>
    <div class="stat"><div class="k">剩余堆内存</div><div class="v" x-text="fmtBytes(st.heap)"></div></div>
    <div class="stat"><div class="k">WiFi 信号</div>
      <div class="v" x-text="st.connected ? (st.rssi + ' dBm') : '-'"></div></div>
    <div class="stat"><div class="k">当前 IP</div>
      <div class="v" style="font-size:15px" x-text="st.ip || '-'"></div></div>
  </div>

  <div class="grid cols2">
    <!-- 屏幕 -->
    <div class="card">
      <h3>屏幕显示 <span class="badge" :class="st.disp ? 'ok' : 'err'" x-text="st.disp ? '已开启' : '已关闭'"></span></h3>
      <div class="row"><span class="k">当前网络</span><span class="v" x-text="st.ssid || '-'"></span></div>
      <div class="row"><span class="k">连接状态</span><span class="v" x-text="st.connected ? '已连接' : '未连接'"></span></div>
      <div class="row"><span class="k">背光亮度</span><span class="v" x-text="(st.dispBright || 0) + '%'"></span></div>
      <div class="bar" style="margin-top:12px">
        <button class="btn" @click="toggleDisp()" x-text="st.disp ? '关闭屏幕' : '打开屏幕'"></button>
        <button class="btn ghost" @click="go('display')">屏幕设置</button>
      </div>
    </div>

    <!-- RGB -->
    <div class="card">
      <h3>RGB 氛围灯</h3>
      <div class="row"><span class="k">当前颜色</span>
        <span class="v"><i class="swatch" :style="'background:' + rgbCss() + ';opacity:' + (0.25 + 0.75 * (st.rgbBright || 0) / 100)"></i><span x-text="st.color || '-'"></span></span></div>
      <div class="row"><span class="k">RGB 值</span>
        <span class="v" x-text="(st.rgb || []).join(', ')"></span></div>
      <div class="row"><span class="k">亮度</span><span class="v" x-text="(st.rgbBright || 0) + '%'"></span></div>
      <div class="bar" style="margin-top:12px">
        <button class="btn" @click="nextLed()">切换颜色</button>
        <button class="btn ghost" @click="go('rgb')">颜色设置</button>
      </div>
    </div>
  </div>

  <!-- 4G 模组状态 -->
  <div class="card">
    <h3>4G 模组状态 <span class="sub">信号 · 运营商 · 注册</span></h3>
    <template x-for="m in modems" :key="m.port">
      <div class="row" style="align-items:flex-start">
        <span class="k">
          <span class="badge" :class="m.enabled ? 'ok' : 'err'" x-text="m.enabled ? '启用' : '禁用'"></span>
          <span class="badge" :class="modemStateClass(m)" x-text="modemStateText(m)"></span>
        </span>
        <span class="v">
          <span x-text="modemName(m.port) + ' · 串口' + m.port"></span>
          <template x-if="m.enabled && m.ready">
            <div style="margin-top:4px;color:#6f7885;font-size:12px;line-height:1.7">
              <div>
                <span x-text="csqBars(m.csq) + ' ' + csqDbm(m.csq)"></span>
                <span x-text="' · ' + (m.oper || '未知运营商')"></span>
                <span x-text="' · ' + (m.reg || '-')"></span>
                <span x-show="m.act" x-text="' · ' + actText(m.act)"></span>
              </div>
              <div>手机号：<b x-text="m.num || '未知号码'"></b></div>
            </div>
          </template>
          <template x-if="m.enabled && !m.ready">
            <span style="margin-left:0;color:#6f7885"
                  x-text="'（' + (m.simReady ? 'SIM 就绪' : '等待 SIM') + '）'"></span>
          </template>
        </span>
      </div>
    </template>
    <div class="bar" style="margin-top:12px">
      <button class="btn ghost sm" @click="go('modem')">模组管理</button>
    </div>
  </div>

  <!-- API 访问令牌 -->
  <div class="card" x-show="token">
    <h3>API 访问令牌 <span class="sub">Bearer Token · 持久化</span></h3>
    <div class="row"><span class="k">令牌</span>
      <span class="v" style="word-break:break-all;font-family:monospace" x-text="tokenMasked"></span>
    </div>
    <div class="bar" style="margin-top:8px">
      <button class="btn ghost sm" @click="tokenShown = !tokenShown" x-text="tokenShown ? '隐藏' : '显示完整'"></button>
      <button class="btn ghost sm" @click="resetToken()" x-text="'重置令牌'"></button>
    </div>
    <div class="hint">供脚本 / 第三方客户端调用，无需 Cookie：<br>
      <code>curl -H "Authorization: Bearer &lt;令牌&gt;" http://设备IP/api/status</code><br>
      令牌持久化于设备 NVS，重启不失效；点击「重置令牌」可使其立即作废并生成新令牌。
    </div>
  </div>
</div>
