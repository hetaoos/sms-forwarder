<div x-data="pageSms()" x-init="init()">
  <div class="page-head">
    <div>
      <h2>短信</h2>
      <p class="page-desc">收发记录与发送 · 新短信自动刷新</p>
    </div>
    <button class="btn" @click="openSend()" x-text="enabledPorts().length ? '发送短信' : '发送短信（无可用模组）'"></button>
  </div>

  <!-- 存储不可用提示（userdata 分区异常时常驻） -->
  <div class="form-err" x-show="storeErr" x-text="storeErr" style="margin-bottom:12px"></div>

  <!-- 短信记录 -->
  <div class="card">
    <div class="bar" style="margin-bottom:12px">
      <select class="inp sm" x-model.number="portFilter">
        <option value="-1">全部模组</option>
        <template x-for="m in modems" :key="m.port">
          <option :value="m.port" x-text="modemLabel(m)"></option>
        </template>
      </select>
      <input class="inp sm" style="flex:1;min-width:160px" placeholder="搜索号码 / 内容"
             x-model="q" @keyup.enter="search()">
      <button class="btn ghost sm" @click="search()">搜索</button>
      <button class="btn ghost sm" @click="clearAll()" x-show="total">清空</button>
    </div>

    <!-- 短信记录：类手机短信列表（点击查看详情） -->
    <div class="msg-list" x-show="!loading && messages.length">
      <template x-for="msg in messages" :key="msg.id">
        <div class="msg-item" :class="msg.dir === 'in' ? 'is-in' : 'is-out'" @click="showDetail(msg)">
          <div class="msg-ava" x-text="(msg.phone || '#').charAt(0).toUpperCase()"></div>
          <div class="msg-body">
            <div class="msg-top">
              <span class="badge" :class="msg.dir === 'in' ? 'ok' : 'warn'"
                    x-text="msg.dir === 'in' ? '收到' : '发送'"></span>
              <span class="msg-phone" x-text="msg.phone"></span>
              <span class="msg-meta">
                <span class="msg-port" x-text="modemLabelOf(msg.modem)"></span>
                <span class="msg-time" x-text="fmtShort(msg.ts)"></span>
              </span>
            </div>
            <div class="msg-text" x-text="preview(msg.content)"></div>
          </div>
          <button class="msg-del" @click.stop="del(msg.id)" title="删除">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 7V5h4v2M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>
          </button>
        </div>
      </template>
    </div>
    <div class="empty" x-show="!loading && !messages.length">
      <div class="icon">✉</div>
      <h3>暂无短信记录</h3>
      <p x-text="(q || portFilter > 0) ? '当前筛选条件下没有记录' : '收到或发出的短信会显示在这里'"></p>
    </div>
    <div class="loading" x-show="loading">加载中…</div>

    <!-- 分页 -->
    <div class="pager" x-show="total > 0">
      <div class="pager-info">
        <span x-text="'共 ' + total + ' 条'"></span>
        <span class="pager-sep">·</span>
        <span x-text="'第 ' + page + ' / ' + pageCount + ' 页'"></span>
      </div>
      <div class="pager-ctrl">
        <button class="btn ghost sm" :disabled="page <= 1" @click="gotoPage(page - 1)">上一页</button>
        <template x-for="p in pages" :key="p">
          <button class="btn ghost sm pager-num" :class="{ on: p === page }" x-text="p" @click="gotoPage(p)"></button>
        </template>
        <button class="btn ghost sm" :disabled="page >= pageCount" @click="gotoPage(page + 1)">下一页</button>
      </div>
      <select class="inp sm" x-model.number="pageSize" @change="changePageSize()" title="每页条数">
        <option value="10">10 条/页</option>
        <option value="20">20 条/页</option>
        <option value="50">50 条/页</option>
      </select>
    </div>
  </div>

  <!-- 发送短信对话框 -->
  <div class="modal-mask" x-show="sendOpen" @click.self="closeSend()" style="display:none">
    <div class="modal send-modal">
      <div class="modal-head">
        <h3>发送短信</h3>
        <button class="modal-close" @click="closeSend()" aria-label="关闭">×</button>
      </div>

      <div class="field">
        <label>模组</label>
        <select class="inp" x-model.number="sendPort">
          <option value="0" x-show="!enabledPorts().length">无可用模组</option>
          <template x-for="m in enabledPorts()" :key="m.port">
            <option :value="m.port" x-text="modemLabel(m) + (m.ready ? '' : ' · 未就绪')"></option>
          </template>
        </select>
      </div>

      <div class="field">
        <label>对方号码</label>
        <input class="inp" placeholder="如 13800138000 或 +86138..." x-model="phone">
      </div>

      <div class="field">
        <label>短信内容 <span class="counter" x-text="content.length + ' 字'"></span></label>
        <textarea class="inp" rows="4" placeholder="输入短信内容" x-model="content"></textarea>
      </div>

      <div class="form-err" x-show="sendErr && sendHint" x-text="sendHint"></div>

      <div class="modal-btns">
        <button class="btn" :disabled="sending || !sendPort"
                @click="send()" x-text="sending ? '发送中…' : '发送'"></button>
        <button class="btn ghost" @click="closeSend()">取消</button>
      </div>
    </div>
  </div>

  <!-- 详情对话框 -->
  <div class="modal-mask" x-show="detail" @click.self="detail = null" style="display:none">
    <div class="modal">
      <h3>短信详情</h3>
      <template x-if="detail">
        <div class="form">
          <div class="row"><span class="k">时间</span><span class="v" x-text="fmtTs(detail.ts)"></span></div>
          <div class="row"><span class="k">模组</span><span class="v" x-text="modemLabelOf(detail.modem)"></span></div>
          <div class="row"><span class="k">方向</span><span class="v" x-text="detail.dir === 'in' ? '收到' : '发送'"></span></div>
          <div class="row"><span class="k">号码</span><span class="v" x-text="detail.phone"></span></div>
          <div class="row"><span class="k">内容</span><span class="v" style="white-space:pre-wrap;text-align:left" x-text="detail.content"></span></div>
        </div>
      </template>
      <div class="bar" style="margin-top:8px">
        <button class="btn ghost" @click="detail = null">关闭</button>
      </div>
    </div>
  </div>
</div>
