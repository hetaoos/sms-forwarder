<div x-data="pageModem()" x-init="init()">
  <div class="page-head">
    <div>
      <h2>通信模组</h2>
      <p class="page-desc">查看与设置通信模组状态、信号强度、运营商、注册与号码</p>
    </div>
    <button class="btn ghost sm" @click="loadPorts()">刷新</button>
  </div>

  <div class="grid cols2">
    <template x-for="m in modems" :key="m.port">
      <div class="card" style="margin-bottom:0">
        <div class="row" style="border-bottom:none">
          <span class="k">
            <span class="badge" :class="m.enabled ? 'ok' : 'err'"
                  x-text="m.enabled ? '已启用' : '已禁用'"></span>
            <span class="badge" :class="modemStateClass(m)"
                  x-text="modemStateText(m)"></span>
          </span>
          <span class="v" x-text="modemLabel(m)"></span>
        </div>
        <!-- 详细状态（启用且就绪时展示遥测） -->
        <template x-if="m.enabled && m.ready">
          <div style="margin:8px 0 4px;font-size:12px;line-height:1.9;color:var(--muted)">
            <div>型号：<b x-text="modemModel(m)"></b></div>
            <div x-show="modemRevision(m)">固件版本：<b x-text="modemRevision(m)"></b></div>
            <div>信号：<b x-text="csqBars(m.csq) + ' ' + csqDbm(m.csq)"></b></div>
            <div>号码：<b x-text="m.num || '未知号码'"></b></div>
            <div>SIM：<b x-text="m.sim ? '就绪' : '未就绪'"></b> ·
                 运营商：<b x-text="(m.operCode ? (m.operCode + (operCn(m.operCode) ? ' · ' + operCn(m.operCode) : '')) : (m.oper || '-'))"></b></div>
            <div>注册：<b x-text="m.reg || '-'"></b><span x-show="m.act" x-text="' · ' + actText(m.act)"></span></div>
            <div>IMEI：<b x-text="m.imei || '-'"></b></div>
          </div>
        </template>
        <div class="bar" style="margin-top:10px">
          <button class="btn sm" :class="m.enabled ? '' : 'ghost'"
                  @click="togglePort(m.port, !m.enabled)"
                  x-text="m.enabled ? '禁用' : '启用'"></button>
          <button class="btn sm ghost" :disabled="!m.enabled"
                  @click="reinitPort(m.port)">重新初始化</button>
          <span class="hint" x-text="!m.enabled ? '停用后该串口不再收发短信'
                : (m.ready ? 'CMGF=0 / CNMI=2,2 已配置' : '初始化中…（等待通信模组应答 / SIM / 注册）')"></span>
        </div>
        <div class="bar" style="margin-top:10px">
          <input class="inp sm" style="flex:1;min-width:120px"
                 x-model="aliasDraft[m.port]"
                 :placeholder="'别名（默认：' + modemName(m.port) + '）'">
          <button class="btn sm ghost" @click="saveAlias(m.port)">保存别名</button>
        </div>
      </div>
    </template>
  </div>

  <div class="card" style="margin-top:16px">
    <h3>说明</h3>
    <p class="page-desc" style="margin:0">
      启用后设备自动将通信模组配置为 PDU 模式（CMGF=0）并开启新短信直投（CNMI=2,2）。<br>
      信号 / 运营商 / 注册 / 号码等遥测每数秒自动刷新；若通信模组停在「故障 / 未连接」，多为未插 SIM 或信号不足。
    </p>
  </div>
</div>
