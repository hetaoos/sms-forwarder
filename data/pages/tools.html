<div x-data="pageTools()" x-init="init()">
  <div class="page-head">
    <div>
      <h2>系统工具</h2>
      <p class="page-desc">固件 OTA 升级与本地刷写（在线升级需后端 CI 已发布对应版本）</p>
    </div>
  </div>

  <!-- 固件升级 -->
  <div class="card">
    <h3>固件升级 <span class="sub" x-show="!otaAvailable" x-cloak>本设备不支持 OTA</span></h3>
    <div class="row"><span class="k">当前版本</span><span class="v" x-text="curVer || '未知'"></span></div>
    <div class="row"><span class="k">最新版本</span><span class="v" x-text="latestVer || '—'"></span></div>

    <div class="bar" style="margin-top:14px">
      <button class="btn" @click="checkUpdate()" :disabled="busy() || !otaAvailable">检查更新</button>
      <button class="btn" @click="doUpgrade()" x-show="latestVer && latestVer !== curVer"
              :disabled="busy() || !otaAvailable" x-cloak>
        升级到 <span x-text="latestVer"></span>
      </button>
    </div>

    <!-- 进度条：进行中或终态时显示 -->
    <div x-show="busy() || otaState===4 || otaState===5" x-cloak style="margin-top:14px">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="flex:1;height:10px;background:var(--border);border-radius:6px;overflow:hidden">
          <div :style="'width:' + otaProgress + '%;height:100%;background:' +
                       (otaState===5 ? 'var(--danger)' : 'var(--primary)') + ';transition:width .25s'"></div>
        </div>
        <span class="hint" style="margin:0;min-width:40px;text-align:right" x-text="otaProgress + '%'"></span>
      </div>
    </div>
    <div class="hint" style="margin-top:10px" x-text="statusLine()"></div>
  </div>

  <!-- 本地刷写 -->
  <div class="card">
    <h3>本地刷写</h3>
    <p class="hint">无网络或离线环境时，可直接上传编译好的固件 / Web UI 镜像（raw 二进制，无需打包）。
      上传成功后设备会自动重启。</p>
    <div class="bar" style="margin-top:8px">
      <div class="field" style="flex:1;min-width:220px"><label>固件 (.bin)</label>
        <input type="file" accept=".bin" @change="onFirmware($event)" :disabled="busy()">
      </div>
      <div class="field"><label>&nbsp;</label>
        <button class="btn" @click="uploadFirmware()" :disabled="!firmwareFile || busy() || !otaAvailable">上传固件</button>
      </div>
    </div>
    <div class="bar" style="margin-top:8px">
      <div class="field" style="flex:1;min-width:220px"><label>Web UI 镜像 (.bin)</label>
        <input type="file" accept=".bin" @change="onLfs($event)" :disabled="busy()">
      </div>
      <div class="field"><label>&nbsp;</label>
        <button class="btn" @click="uploadLfs()" :disabled="!lfsFile || busy() || !otaAvailable">上传 Web UI</button>
      </div>
    </div>
  </div>
</div>
