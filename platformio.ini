; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32s3_120_16_8-qio_opi
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem101
build_flags =
    -Isrc
    -DLGFX_USE_V1=1
    ; 编译期内置的默认 WiFi 账号密码（启动时优先尝试）；
    ; 留空则不内置，完全依赖 NVS 中保存的配置（首次无配置 -> AP 配网模式）
    ; 示例：-DWIFI_SSID_DEFAULT=\"MyWiFi\" -DWIFI_PASS_DEFAULT=\"MyPass\"
    -DWIFI_SSID_DEFAULT=\"\"
    -DWIFI_PASS_DEFAULT=\"\"
; 版本取自 PlatformIO Registry 最新发布：
; ESPAsyncWebServer 3.12.1 / AsyncTCP 3.5.0 / LovyanGFX 1.2.33
lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.12.1
    ESP32Async/AsyncTCP @ ^3.5.0
    lovyan03/LovyanGFX @ ^1.2.33
    bblanchon/ArduinoJson @ ^7.2.0
; ESPAsyncWebServer 依赖声明里带了 ESP8266/Pico 用的 TCP 实现，ESP32 上只走 AsyncTCP
lib_ignore =
    ESPAsyncTCP
    RPAsyncTCP
