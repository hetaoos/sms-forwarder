; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
; data/ 资源打包时自动 gzip 并上传到 spiffs 资源分区（见 script/uploadfs_gz.py）：
; 执行 buildfs / uploadfs 前自动把 data/ 换成 .gz 版本构建，完成后恢复源文件；
; 烧录固件（pio run -t upload）结束后也会自动上传一次 FS 镜像。
extra_scripts =
    pre:script/uploadfs_gz.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32s3_120_16_8-qio_opi
framework = arduino
monitor_speed = 460800
upload_port = /dev/cu.usbmodem101
; Web UI 资源打包进 LittleFS 资源分区（见 partitions/esp32s3_16mb.csv）：
; 页面放在项目 data/ 目录，改完页面后执行
;   pio run -e esp32s3 -t uploadfs
; 上传文件系统镜像（与固件烧录相互独立）。
; 注意：uploadfs 的目标是分区表中最后一个 FS 分区（spiffs 资源分区）；
; userdata（5MB 用户数据，刷固件保留）由设备运行期挂载于 /data 读写。
board_build.filesystem = littlefs
board_build.partitions = partitions/esp32s3_16mb.csv
build_flags =
    -Isrc
    -DLGFX_USE_V1=1
    ; ReadyMail 0.4.x 使用了 C++17 的 inline 变量，显式指定标准以消除告警/报错；
    ; arduino-esp32 框架默认强加 -std=gnu++11，需配合下方 build_unflags 先移除
    -std=gnu++17
    ; 编译期内置的默认 WiFi 账号密码（启动时优先尝试）；
    ; 留空则不内置，完全依赖 NVS 中保存的配置（首次无配置 -> AP 配网模式）
    ; 示例：-DWIFI_SSID_DEFAULT=\"MyWiFi\" -DWIFI_PASS_DEFAULT=\"MyPass\"
    -DWIFI_SSID_DEFAULT=\"\"
    -DWIFI_PASS_DEFAULT=\"\"
; 先移除框架默认的 C++ 标准，否则 -std=gnu++17 会被盖掉（ReadyMail 编译失败）
build_unflags = -std=gnu++11 -std=c++11
; 版本取自 PlatformIO Registry 最新发布：
; ESPAsyncWebServer 3.12.1 / AsyncTCP 3.5.0 / LovyanGFX 1.2.33 / ReadyMail 0.4.2
lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.12.1
    ESP32Async/AsyncTCP @ ^3.5.0
    lovyan03/LovyanGFX @ ^1.2.33
    bblanchon/ArduinoJson @ ^7.2.0
    mobizt/ReadyMail @ ^0.4.2
; ESPAsyncWebServer 依赖声明里带了 ESP8266/Pico 用的 TCP 实现，ESP32 上只走 AsyncTCP
lib_ignore =
    ESPAsyncTCP
    RPAsyncTCP
